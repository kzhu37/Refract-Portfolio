name: Neutralize presentation framing

on:
  push:
    paths:
      - .github/workflows/scrub-presentation-framing.yml

permissions:
  contents: write

jobs:
  scrub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update portfolio wording
        shell: python
        run: |
          from pathlib import Path
          replacements = {
              "README.md": [
                  ("My contribution combined product thinking, user research, iteration, presentation, and later engineering refinement.", "My contribution combined product thinking, user research, iteration, product communication, and later engineering refinement."),
                  ("The presentation-era testing process produced **75 initial survey responses** and a later follow-up of approximately **50 respondents**.", "The early testing process produced **75 initial survey responses** and a later follow-up of approximately **50 respondents**."),
              ],
              "docs/media/user-testing.svg": [
                  ("Presentation-era survey results and the design decisions that followed", "Early survey results and the design decisions that followed"),
              ],
          }
          for file_name, pairs in replacements.items():
              path = Path(file_name)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"Expected text not found in {file_name}: {old}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
      - name: Commit wording update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/media/user-testing.svg
          git commit -m "Use neutral project framing in portfolio"
          git push
