name: Apply Refract README hero

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-refract-hero.yml

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Replace old README title block
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          old = '''<p align="center">
            <img src="src/renderer/src/assets/refract-prism.svg" alt="Refract prism logo" width="112">
          </p>

          <h1 align="center">Refract</h1>
          '''
          new = '''<p align="center">
            <img src="docs/media/refract-hero.svg" alt="Refract, Clarity, Perfected" width="100%">
          </p>
          '''

          if old not in text:
              raise SystemExit('Expected README title block was not found')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit README change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: replace Refract title with branded hero"
          git push origin main
