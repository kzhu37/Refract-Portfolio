<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="682" viewBox="0 0 2048 682" role="img" aria-labelledby="title desc">
  <title id="title">Refract, Clarity, Perfected</title>
  <desc id="desc">Refract header with a glowing prism, soft white light entering from the left, blue and violet rays leaving to the right, and the Refract wordmark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#02051a"/>
      <stop offset="0.5" stop-color="#050827"/>
      <stop offset="1" stop-color="#02051a"/>
    </linearGradient>
    <linearGradient id="prism" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7f39ff"/>
      <stop offset="0.2" stop-color="#3f6fff"/>
      <stop offset="0.38" stop-color="#a6e6ff"/>
      <stop offset="0.58" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="ray1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a35ff"/>
      <stop offset="0.38" stop-color="#6847ff"/>
      <stop offset="0.72" stop-color="#1b8dff"/>
      <stop offset="1" stop-color="#0879ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tag" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f3cff"/>
      <stop offset="0.5" stop-color="#6575ff"/>
      <stop offset="1" stop-color="#19b7ff"/>
    </linearGradient>
    <filter id="blur12" x="-30%" y="-100%" width="180%" height="300%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="blur24" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="g"/>
      <feMerge>
        <feMergeNode in="g"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="2048" height="682" fill="url(#bg)"/>
  <ellipse cx="1026" cy="210" rx="420" ry="240" fill="#101949" opacity="0.10"/>

  <g fill="none" stroke="#f7f8ff" stroke-linecap="round" filter="url(#blur12)">
    <path d="M355 160 C520 115 645 125 770 180 C830 206 885 219 940 216" stroke-width="18" opacity="0.35"/>
    <path d="M350 218 C530 172 660 180 790 215 C850 232 900 238 953 225" stroke-width="22" opacity="0.70"/>
    <path d="M360 278 C520 315 650 298 785 250 C850 228 905 225 955 232" stroke-width="18" opacity="0.42"/>
  </g>

  <circle cx="972" cy="225" r="58" fill="#ffffff" opacity="0.28" filter="url(#blur24)"/>
  <circle cx="980" cy="225" r="24" fill="#dff4ff" opacity="0.72" filter="url(#blur12)"/>

  <g opacity="0.98">
    <rect x="1128" y="215" width="420" height="7" rx="3.5" fill="url(#ray1)"/>
    <rect x="1128" y="232" width="500" height="7" rx="3.5" fill="url(#ray1)" opacity="0.94"/>
    <rect x="1128" y="249" width="545" height="7" rx="3.5" fill="url(#ray1)" opacity="0.86"/>
    <rect x="1128" y="266" width="495" height="7" rx="3.5" fill="url(#ray1)" opacity="0.78"/>
    <rect x="1128" y="283" width="435" height="7" rx="3.5" fill="url(#ray1)" opacity="0.68"/>
  </g>

  <path d="M1024 92 L1169 349 L879 349 Z" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="32" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M1024 92 L1169 349 L879 349 Z" fill="none" stroke="url(#prism)" stroke-width="19" stroke-linejoin="round" stroke-linecap="round"/>

  <path d="M889 334 Q938 350 997 341" fill="none" stroke="#803cff" stroke-width="9" stroke-linecap="round" opacity="0.78"/>
  <path d="M895 326 Q945 342 1010 336" fill="none" stroke="#69ceff" stroke-width="6" stroke-linecap="round" opacity="0.72"/>

  <text x="1024" y="528" text-anchor="middle" fill="#ffffff" font-family="Helvetica Neue,Segoe UI,Arial,sans-serif" font-size="142" font-weight="300" letter-spacing="-5">refract</text>
  <text x="1024" y="598" text-anchor="middle" fill="url(#tag)" font-family="Helvetica Neue,Segoe UI,Arial,sans-serif" font-size="34" font-weight="500" letter-spacing="18">CLARITY, PERFECTED.</text>
</svg>
