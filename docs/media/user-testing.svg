<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Refract user testing and iteration</title>
  <desc id="desc">A diagram summarizing 75 initial responses, about 50 follow-up respondents, 93 percent reporting continued use, 22 percent reporting sharing, and examples of product changes driven by feedback.</desc>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B1E"/>
      <stop offset="1" stop-color="#10183B"/>
    </linearGradient>
    <linearGradient id="stat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7B5CF0"/>
      <stop offset="1" stop-color="#4B8AF0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg3)"/>
  <text x="70" y="78" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700">Testing changed the product</text>
  <text x="70" y="112" fill="#8BADC8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Presentation-era survey results and the design decisions that followed</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="70" y="170" width="230" height="170" rx="18" fill="#0F1635" stroke="#4B8AF0" stroke-opacity="0.35"/>
    <text x="95" y="210" fill="#7FAEFF" font-size="13" font-weight="700" letter-spacing="1.1">INITIAL TESTING</text>
    <text x="95" y="272" fill="url(#stat)" font-size="58" font-weight="800">75</text>
    <text x="95" y="308" fill="#8BADC8" font-size="16">survey responses</text>

    <rect x="330" y="170" width="230" height="170" rx="18" fill="#0F1635" stroke="#7B5CF0" stroke-opacity="0.35"/>
    <text x="355" y="210" fill="#A493FF" font-size="13" font-weight="700" letter-spacing="1.1">FOLLOW-UP</text>
    <text x="355" y="272" fill="#FFFFFF" font-size="58" font-weight="800">~50</text>
    <text x="355" y="308" fill="#8BADC8" font-size="16">respondents</text>

    <rect x="590" y="170" width="230" height="170" rx="18" fill="#0F1635" stroke="#2DD4BF" stroke-opacity="0.35"/>
    <text x="615" y="210" fill="#5EEAD4" font-size="13" font-weight="700" letter-spacing="1.1">SELF-REPORTED</text>
    <text x="615" y="272" fill="#FFFFFF" font-size="58" font-weight="800">93%</text>
    <text x="615" y="308" fill="#8BADC8" font-size="16">reported continued use</text>

    <rect x="850" y="170" width="280" height="170" rx="18" fill="#0F1635" stroke="#FBBF24" stroke-opacity="0.35"/>
    <text x="875" y="210" fill="#FCD34D" font-size="13" font-weight="700" letter-spacing="1.1">SELF-REPORTED</text>
    <text x="875" y="272" fill="#FFFFFF" font-size="58" font-weight="800">22%</text>
    <text x="875" y="308" fill="#8BADC8" font-size="16">reported sharing Refract</text>

    <text x="70" y="400" fill="#FFFFFF" font-size="19" font-weight="650">Feedback to design change</text>

    <rect x="70" y="430" width="330" height="105" rx="16" fill="#0C1230" stroke="#304877"/>
    <text x="92" y="461" fill="#7FAEFF" font-size="14" font-weight="700">CALIBRATION LANGUAGE</text>
    <text x="92" y="491" fill="#8BADC8" font-size="15">Technical wording caused confusion.</text>
    <text x="92" y="516" fill="#FFFFFF" font-size="15">Instructions were rewritten in plain language.</text>

    <rect x="435" y="430" width="330" height="105" rx="16" fill="#0C1230" stroke="#304877"/>
    <text x="457" y="461" fill="#A493FF" font-size="14" font-weight="700">BEFORE / AFTER</text>
    <text x="457" y="491" fill="#8BADC8" font-size="15">The toggle made the concept tangible.</text>
    <text x="457" y="516" fill="#FFFFFF" font-size="15">It was moved earlier in the experience.</text>

    <rect x="800" y="430" width="330" height="105" rx="16" fill="#0C1230" stroke="#304877"/>
    <text x="822" y="461" fill="#5EEAD4" font-size="14" font-weight="700">COMFORT + REVERSIBILITY</text>
    <text x="822" y="491" fill="#8BADC8" font-size="15">Users feared harsh or irreversible changes.</text>
    <text x="822" y="516" fill="#FFFFFF" font-size="15">Strength was reduced and reset was emphasized.</text>
  </g>

  <text x="70" y="578" fill="#4E6B8F" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">These figures summarize exploratory survey feedback, not clinical efficacy or controlled validation.</text>
</svg>