name: Portfolio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Verify portfolio presentation
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = require('path')

          const readme = fs.readFileSync('README.md', 'utf8')
          const forbidden = [
            ['em dash', '\u2014'],
            ['en dash', '\u2013']
          ]

          const publicFiles = ['README.md']
          const collect = (dir, extensions) => {
            if (!fs.existsSync(dir)) return
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name)
              if (entry.isDirectory()) collect(full, extensions)
              else if (extensions.has(path.extname(entry.name))) publicFiles.push(full)
            }
          }

          collect('docs/media', new Set(['.svg']))
          collect('web-demo', new Set(['.ts', '.tsx', '.css', '.html']))

          for (const file of [...new Set(publicFiles)]) {
            const text = fs.readFileSync(file, 'utf8')
            for (const [label, character] of forbidden) {
              if (text.includes(character)) {
                console.error(`${file} contains a forbidden ${label}`)
                process.exit(1)
              }
            }
          }

          if (/\badmissions?\b/i.test(readme)) {
            console.error('README contains public-facing admissions wording')
            process.exit(1)
          }

          const media = [...new Set(readme.match(/docs\/media\/[A-Za-z0-9._/-]+/g) || [])]
          const missing = media.filter((file) => !fs.existsSync(file))
          if (missing.length) {
            console.error(`README references missing media:\n${missing.join('\n')}`)
            process.exit(1)
          }

          const shader = fs.readFileSync('src/overlay/lib/webgl/correction-shader.ts', 'utf8')
          if (shader.includes('u_zoom')) {
            console.error('Correction shader still contains magnification state')
            process.exit(1)
          }

          console.log(`Portfolio presentation check passed for ${media.length} media references and ${publicFiles.length} public text files`)
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Verify numerical invariants
        run: npm test

      - name: Build application
        run: npm run build

      - name: Build browser demo
        run: npm run build:web-demo

      - name: Upload browser demo artifact
        uses: actions/upload-artifact@v4
        with:
          name: refract-web-demo-dist
          path: web-demo-dist
          if-no-files-found: error
          retention-days: 1

  finalize:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Apply final credibility and presentation edits
        run: |
          python - <<'PY'
