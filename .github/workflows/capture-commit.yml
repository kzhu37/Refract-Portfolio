name: Capture Live Demo Proof

on:
  push:
    branches: [portfolio-final-polish]

permissions:
  contents: write

jobs:
  capture:
    if: ${{ !contains(github.event.head_commit.message, '[skip capture]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DEMO_URL: https://refract-portfolio.vercel.app

    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio-final-polish

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install capture dependencies
        run: python -m pip install --disable-pip-version-check selenium pillow

      - name: Capture production demo
        run: |
          python - <<'PY'
          import os
          import time
          from pathlib import Path
          from PIL import Image
          from selenium import webdriver
          from selenium.webdriver.common.action_chains import ActionChains
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          out = Path('docs/media')
          options = webdriver.ChromeOptions()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--enable-webgl')
          options.add_argument('--ignore-gpu-blocklist')
          options.add_argument('--enable-unsafe-swiftshader')
          options.add_argument('--use-gl=angle')
          options.add_argument('--use-angle=swiftshader')

          driver = webdriver.Chrome(options=options)
          try:
              driver.set_window_size(1500, 1200)
              driver.get(os.environ['DEMO_URL'])
              wait = WebDriverWait(driver, 35)
              wait.until(EC.presence_of_element_located((By.CSS_SELECTOR, '.demo-shell')))
              wait.until(lambda d: d.find_element(By.CSS_SELECTOR, '.pipeline-status').get_attribute('data-render-status') == 'ready')

              stage = driver.find_element(By.CSS_SELECTOR, '[data-testid="correction-stage"]')
              driver.execute_script("arguments[0].scrollIntoView({block:'center'});", stage)
              time.sleep(0.4)
              ActionChains(driver).move_to_element(stage).move_by_offset(-80, -25).perform()
              time.sleep(0.8)

              shell = driver.find_element(By.CSS_SELECTOR, '.demo-shell')
              corrected_png = out / 'browser-demo-correction.png'
              original_png = out / 'browser-demo-original.png'
              shell.screenshot(str(corrected_png))

              toggle = driver.find_element(By.CSS_SELECTOR, '[role="switch"]')
              toggle.click()
              wait.until(lambda d: toggle.get_attribute('aria-checked') == 'false')
              time.sleep(0.5)
              shell.screenshot(str(original_png))
          finally:
              driver.quit()

          for stem in ('browser-demo-correction', 'browser-demo-original'):
              png = out / f'{stem}.png'
              image = Image.open(png).convert('RGB')
              if image.width > 1280:
                  height = round(image.height * 1280 / image.width)
                  image = image.resize((1280, height), Image.Resampling.LANCZOS)
              image.save(out / f'{stem}.webp', 'WEBP', quality=86, method=6)
              png.unlink()
          PY

      - name: Commit proof images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/media/browser-demo-correction.webp docs/media/browser-demo-original.webp
          git diff --cached --quiet && exit 0
          git commit -m "Add live browser correction proof [skip capture]"
          git push origin HEAD:portfolio-final-polish
