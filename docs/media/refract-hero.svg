<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400" role="img" aria-labelledby="title desc">
  <title id="title">Refract, Clarity, Perfected</title>
  <desc id="desc">Refract prism branding with white light entering from the left and blue and violet light emerging to the right.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030718"/>
      <stop offset="0.48" stop-color="#070c2a"/>
      <stop offset="1" stop-color="#020616"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3cff"/>
      <stop offset="0.22" stop-color="#4f7cff"/>
      <stop offset="0.42" stop-color="#dff7ff"/>
      <stop offset="0.68" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8c3fff"/>
      <stop offset="0.45" stop-color="#496cff"/>
      <stop offset="0.78" stop-color="#159dff"/>
      <stop offset="1" stop-color="#0566d8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tag" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9747ff"/>
      <stop offset="0.52" stop-color="#5e72ff"/>
      <stop offset="1" stop-color="#17b8ff"/>
    </linearGradient>
    <filter id="mist" x="-30%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="flare" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="400" fill="url(#bg)"/>
  <ellipse cx="805" cy="170" rx="330" ry="205" fill="#17215a" opacity="0.08"/>

  <g opacity="0.9" filter="url(#mist)" fill="none" stroke="#f6f8ff" stroke-linecap="round">
    <path d="M165 122 C290 93 360 107 450 145 C520 175 570 177 660 161" stroke-width="12" opacity="0.33"/>
    <path d="M155 168 C290 131 366 141 468 169 C542 189 598 187 674 169" stroke-width="15" opacity="0.62"/>
    <path d="M165 214 C285 246 370 234 462 201 C530 176 592 178 672 179" stroke-width="13" opacity="0.42"/>
  </g>

  <g opacity="0.96">
    <rect x="933" y="140" width="365" height="7" rx="3.5" fill="url(#spectrum)"/>
    <rect x="933" y="154" width="395" height="6" rx="3" fill="url(#spectrum)" opacity="0.9"/>
    <rect x="933" y="168" width="420" height="6" rx="3" fill="url(#spectrum)" opacity="0.8"/>
    <rect x="933" y="182" width="382" height="6" rx="3" fill="url(#spectrum)" opacity="0.74"/>
    <rect x="933" y="196" width="342" height="6" rx="3" fill="url(#spectrum)" opacity="0.66"/>
  </g>

  <circle cx="682" cy="172" r="44" fill="#ffffff" opacity="0.20" filter="url(#flare)"/>
  <circle cx="688" cy="173" r="19" fill="#dcecff" opacity="0.55" filter="url(#flare)"/>

  <path d="M800 42 L947 238 L653 238 Z" fill="none" stroke="#ffffff" stroke-opacity="0.20" stroke-width="27" stroke-linejoin="round" filter="url(#softGlow)"/>
  <path d="M800 42 L947 238 L653 238 Z" fill="none" stroke="url(#edge)" stroke-width="18" stroke-linejoin="round" stroke-linecap="round"/>

  <path d="M659 228 Q712 245 766 235" fill="none" stroke="#7d3cff" stroke-width="7" stroke-linecap="round" opacity="0.75"/>
  <path d="M665 221 Q718 237 781 230" fill="none" stroke="#68c8ff" stroke-width="5" stroke-linecap="round" opacity="0.72"/>

  <text x="800" y="321" text-anchor="middle" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="104" font-weight="400" letter-spacing="-3">refract</text>
  <text x="800" y="365" text-anchor="middle" fill="url(#tag)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="500" letter-spacing="11">CLARITY, PERFECTED.</text>
</svg>