name: Rename Refract header asset

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-refract-header.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename-header:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update README and remove broken SVG wrapper
        shell: bash
        run: |
          sed -i 's#docs/media/refract-hero.svg#docs/media/refract-header.jpg#g' README.md
          git rm docs/media/refract-hero.svg
          git rm .github/workflows/rename-refract-header.yml

      - name: Commit header fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: use Refract header image'
          git pull --rebase origin main
          git push origin HEAD:main
