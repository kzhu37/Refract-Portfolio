name: Repair production comparison check

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace keyboard hold simulation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/production-smoke.yml')
          text = path.read_text(encoding='utf-8')
          old = '''              compare = driver.find_element(By.XPATH, "//button[contains(., 'Hold for original')]")
              ActionChains(driver).key_down(Keys.SPACE, compare).perform()
              wait.until(lambda d: 'Original source' in d.find_element(By.CSS_SELECTOR, '.stage-corner-label').text)
              ActionChains(driver).key_up(Keys.SPACE, compare).perform()
              print('original comparison: ok')
'''
          new = '''              compare = driver.find_element(By.XPATH, "//button[contains(., 'Hold for original')]")
              driver.execute_script("arguments[0].focus(); arguments[0].dispatchEvent(new KeyboardEvent('keydown',{key:' ',bubbles:true,cancelable:true}));", compare)
              wait.until(lambda d: 'Original source' in d.find_element(By.CSS_SELECTOR, '.stage-corner-label').text)
              driver.execute_script("arguments[0].dispatchEvent(new KeyboardEvent('keyup',{key:' ',bubbles:true,cancelable:true}));", compare)
              print('original comparison: ok')
'''
          if old not in text:
              raise SystemExit('Comparison test block was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit test repair
        run: |
          git config user.name "Kevin Zhu"
          git config user.email "126812866+kzhu37@users.noreply.github.com"
          git add .github/workflows/production-smoke.yml
          git commit -m "Use explicit keyboard events for comparison smoke"
          git push
