name: Portfolio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Verify portfolio presentation
        run: |
          node <<'NODE'
          const fs = require('fs')
          const readme = fs.readFileSync('README.md', 'utf8')

          const forbidden = [
            ['em dash', '\u2014'],
            ['en dash', '\u2013']
          ]

          for (const [label, character] of forbidden) {
            if (readme.includes(character)) {
              console.error(`README contains a forbidden ${label}`)
              process.exit(1)
            }
          }

          if (/\badmissions?\b/i.test(readme)) {
            console.error('README contains public-facing admissions wording')
            process.exit(1)
          }

          const media = [...new Set(readme.match(/docs\/media\/[A-Za-z0-9._/-]+/g) || [])]
          const missing = media.filter((path) => !fs.existsSync(path))

          if (missing.length) {
            console.error(`README references missing media:\n${missing.join('\n')}`)
            process.exit(1)
          }

          console.log(`Portfolio presentation check passed for ${media.length} media references`)
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Verify numerical invariants
        run: npm test

      - name: Build application
        run: npm run build

      - name: Build browser demo
        run: npm run build:web-demo

      - name: Upload browser demo artifact
        uses: actions/upload-artifact@v4
        with:
          name: refract-web-demo-dist
          path: web-demo-dist
          if-no-files-found: error
          retention-days: 1
