name: Production Browser Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-browser-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DEMO_URL: https://refract-portfolio.vercel.app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Wait for coherent production deployment
        run: |
          set -euo pipefail
          ready=0

          for attempt in $(seq 1 12); do
            code=$(curl -L --max-time 30 -sS -o /tmp/refract-production.html -w '%{http_code}' "$DEMO_URL")
            asset=$(grep -oE 'src="/assets/[^"]+\.js"' /tmp/refract-production.html | head -1 | sed 's/^src="//;s/"$//' || true)

            echo "Attempt $attempt: HTML status $code, asset ${asset:-missing}"

            if [ "$code" = "200" ] && grep -q 'Refract' /tmp/refract-production.html && [ -n "$asset" ]; then
              asset_code=$(curl -L --max-time 30 -sS -o /tmp/refract-production.js -w '%{http_code}' "$DEMO_URL$asset")
              if [ "$asset_code" = "200" ] && ! grep -Eqi '<!doctype html|<html' /tmp/refract-production.js; then
                ready=1
                break
              fi
              echo "Asset was not ready yet: HTTP $asset_code"
            fi

            sleep 5
          done

          test "$ready" = "1"
          echo "Title: $(grep -o '<title>[^<]*</title>' /tmp/refract-production.html | head -1 || true)"
          echo "Production HTML and its current hashed JavaScript asset are coherent."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser test driver
        run: python -m pip install --disable-pip-version-check selenium

      - name: Exercise production demo
        run: |
          python - <<'PY'
          import hashlib
          import os
          import time
          from selenium import webdriver
          from selenium.common.exceptions import TimeoutException
          from selenium.webdriver.common.action_chains import ActionChains
          from selenium.webdriver.common.by import By
          from selenium.webdriver.common.keys import Keys
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          URL = os.environ['DEMO_URL'].rstrip('/')

          def make_driver():
              options = webdriver.ChromeOptions()
              options.add_argument('--headless=new')
              options.add_argument('--no-sandbox')
              options.add_argument('--disable-dev-shm-usage')
              options.add_argument('--enable-webgl')
              options.add_argument('--ignore-gpu-blocklist')
              options.add_argument('--enable-unsafe-swiftshader')
              options.add_argument('--use-gl=angle')
              options.add_argument('--use-angle=swiftshader')
              options.set_capability('goog:loggingPrefs', {'browser': 'ALL'})
              return webdriver.Chrome(options=options)

          def ready(driver, timeout=35):
              wait = WebDriverWait(driver, timeout)
              try:
                  wait.until(EC.presence_of_element_located((By.CSS_SELECTOR, 'h1')))
                  wait.until(lambda d: d.find_element(By.CSS_SELECTOR, '.pipeline-status').get_attribute('data-render-status') != 'initializing')
              except TimeoutException:
                  print('TIMEOUT current URL:', driver.current_url)
                  print('TIMEOUT title:', driver.title)
                  print('TIMEOUT body:', driver.find_element(By.TAG_NAME, 'body').text[:1600] if driver.find_elements(By.TAG_NAME, 'body') else '(no body)')
                  print('TIMEOUT console:', driver.get_log('browser'))
                  raise
              return wait

          driver = make_driver()
          try:
              driver.set_window_size(1440, 1100)
              driver.get(URL)
              ready(driver)
              assert 'Interactive Browser Demo' in driver.title
              assert 'correction pipeline work in your browser' in driver.find_element(By.CSS_SELECTOR, 'h1').text
              status = driver.find_element(By.CSS_SELECTOR, '.pipeline-status').get_attribute('data-render-status')
              webgl2 = driver.execute_script("return !!document.createElement('canvas').getContext('webgl2')")
              print('production render status:', status, 'WebGL2:', webgl2)
              assert webgl2, 'GitHub-hosted Chrome did not expose WebGL2'
              assert status == 'ready', driver.find_element(By.CSS_SELECTOR, '.pipeline-status').text

              stage = driver.find_element(By.CSS_SELECTOR, '[data-testid="correction-stage"]')
              canvas_size = driver.execute_script("const c=document.querySelector('.correction-canvas'); return [c.width,c.height]")
              assert canvas_size[0] > 0 and canvas_size[1] > 0, f'correction canvas has invalid size: {canvas_size}'

              driver.execute_script("arguments[0].scrollIntoView({block:'center',inline:'center'});", stage)
              time.sleep(0.2)
              ActionChains(driver).move_to_element(stage).move_by_offset(-60, -40).perform(); time.sleep(0.5)
              a = hashlib.sha256(stage.screenshot_as_png).hexdigest()
              ActionChains(driver).move_to_element(stage).move_by_offset(60, 40).perform(); time.sleep(0.5)
              b = hashlib.sha256(stage.screenshot_as_png).hexdigest()
              print('stage screenshot hashes:', a, b, 'canvas size:', canvas_size)
              assert a != b, 'moving the cursor did not change the rendered correction-stage output'

              wait = WebDriverWait(driver, 5)
              toggle = driver.find_element(By.CSS_SELECTOR, '[role="switch"]')
              assert toggle.get_attribute('aria-checked') == 'true'
              toggle.click()
              wait.until(lambda d: toggle.get_attribute('aria-checked') == 'false')
              toggle.click()
              wait.until(lambda d: toggle.get_attribute('aria-checked') == 'true')
              print('correction toggle: ok')

              driver.find_element(By.XPATH, "//button[contains(., 'Directional')]").click()
              wait.until(lambda d: d.find_element(By.ID, 'sphere').get_attribute('value') == '-1.75')
              wait.until(lambda d: d.find_element(By.ID, 'cylinder').get_attribute('value') == '-1.25')
              wait.until(lambda d: d.find_element(By.ID, 'axis').get_attribute('value') == '35')
              print('directional preset: ok')
              driver.find_element(By.XPATH, "//button[normalize-space()='Reset']").click()
              wait.until(lambda d: d.find_element(By.ID, 'sphere').get_attribute('value') == '-2.25')
              print('reset: ok')

              compare = driver.find_element(By.XPATH, "//button[contains(., 'Hold for original')]")
              assert compare.is_displayed() and compare.is_enabled()
              assert compare.get_attribute('type') == 'button'
              print('original comparison control: present and enabled')

              driver.set_window_size(390, 844); time.sleep(0.2)
              widths = driver.execute_script('return [document.documentElement.scrollWidth, document.documentElement.clientWidth]')
              print('mobile widths:', widths)
              assert widths[0] == widths[1]

              severe = [x for x in driver.get_log('browser') if x['level'] == 'SEVERE']
              print('severe console entries:', severe)
              assert not severe
          finally:
              driver.quit()

          fallback = make_driver()
          try:
              fallback.get(URL + '/?webgl=off')
              ready(fallback)
              status = fallback.find_element(By.CSS_SELECTOR, '.pipeline-status').get_attribute('data-render-status')
              text = fallback.find_element(By.CSS_SELECTOR, '.pipeline-status').text
              print('forced fallback:', status, text)
              assert status == 'unsupported'
              assert 'fallback' in text.lower()
              assert fallback.find_element(By.CSS_SELECTOR, '.source-canvas').is_displayed()
          finally:
              fallback.quit()

          camera = make_driver()
          try:
              camera.set_window_size(1440, 1100)
              camera.get(URL)
              ready(camera)
              camera_wait = WebDriverWait(camera, 10)
              camera_choice = camera_wait.until(EC.presence_of_element_located((By.XPATH, "//button[@role='radio' and contains(., 'Camera gaze')]")))
              assert camera_choice.is_displayed() and camera_choice.is_enabled()
              camera.execute_script("arguments[0].focus();", camera_choice)
              camera_choice.send_keys(Keys.ENTER)
              consent = camera_wait.until(EC.visibility_of_element_located((By.CSS_SELECTOR, '.camera-consent')))
              assert 'Before the browser asks' in consent.text
              continue_button = camera_wait.until(EC.element_to_be_clickable((By.XPATH, "//button[contains(., 'Continue to camera')]")))
              assert continue_button.is_displayed() and continue_button.is_enabled()
              print('camera consent keyboard path: ok')
          finally:
              camera.quit()

          deep = make_driver()
          try:
              deep.set_window_size(1440, 1100)
              last_error = None
              for attempt in range(1, 4):
                  try:
                      deep.get(URL + '/portfolio-check')
                      ready(deep, timeout=15)
                      last_error = None
                      break
                  except TimeoutException as error:
                      last_error = error
                      print(f'deep-link attempt {attempt} was not ready; retrying')
                      time.sleep(2)
              if last_error is not None:
                  raise last_error
              assert 'correction pipeline work in your browser' in deep.find_element(By.CSS_SELECTOR, 'h1').text
              assert 'localhost' not in deep.page_source.lower()
              severe = [x for x in deep.get_log('browser') if x['level'] == 'SEVERE']
              assert not severe, severe
              print('deep-link refresh path: ok')
          finally:
              deep.quit()
          PY
