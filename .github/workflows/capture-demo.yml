name: Capture Demo Proof

on:
  push:
    branches: [portfolio-final-polish]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DEMO_URL: https://refract-portfolio.vercel.app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser driver
        run: python -m pip install --disable-pip-version-check selenium

      - name: Capture live demo states
        run: |
          mkdir -p demo-proof
          python - <<'PY'
          import os
          import time
          from selenium import webdriver
          from selenium.webdriver.common.action_chains import ActionChains
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          options = webdriver.ChromeOptions()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--enable-webgl')
          options.add_argument('--ignore-gpu-blocklist')
          options.add_argument('--enable-unsafe-swiftshader')
          options.add_argument('--use-gl=angle')
          options.add_argument('--use-angle=swiftshader')

          driver = webdriver.Chrome(options=options)
          try:
              driver.set_window_size(1500, 1200)
              driver.get(os.environ['DEMO_URL'])
              wait = WebDriverWait(driver, 35)
              wait.until(EC.presence_of_element_located((By.CSS_SELECTOR, '.demo-shell')))
              wait.until(lambda d: d.find_element(By.CSS_SELECTOR, '.pipeline-status').get_attribute('data-render-status') == 'ready')

              stage = driver.find_element(By.CSS_SELECTOR, '[data-testid="correction-stage"]')
              driver.execute_script("arguments[0].scrollIntoView({block:'center'});", stage)
              time.sleep(0.4)
              ActionChains(driver).move_to_element(stage).move_by_offset(-80, -25).perform()
              time.sleep(0.8)

              shell = driver.find_element(By.CSS_SELECTOR, '.demo-shell')
              shell.screenshot('demo-proof/browser-demo-correction.png')

              toggle = driver.find_element(By.CSS_SELECTOR, '[role="switch"]')
              toggle.click()
              wait.until(lambda d: toggle.get_attribute('aria-checked') == 'false')
              time.sleep(0.5)
              shell.screenshot('demo-proof/browser-demo-original.png')
          finally:
              driver.quit()
          PY

      - name: Upload proof images
        uses: actions/upload-artifact@v4
        with:
          name: refract-demo-proof
          path: demo-proof
          if-no-files-found: error
          retention-days: 1
