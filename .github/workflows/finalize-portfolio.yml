name: Finalize Refract Portfolio

on:
  push:
    branches: [refract-desktop-proof]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out portfolio branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply final portfolio edits
        run: python scripts/finalize-portfolio.py

      - name: Remove confirmed unused TensorFlow dependency
        run: npm uninstall @tensorflow/tfjs

      - name: Type-check
        run: npm run typecheck

      - name: Verify numerical invariants
        run: npm test

      - name: Build desktop application
        run: npm run build

      - name: Build browser demo
        run: npm run build:web-demo

      - name: Commit verified showcase state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- .github/workflows/ci.yml
          git rm .github/workflows/finalize-portfolio.yml scripts/finalize-portfolio.py
          git add -A
          git commit -m "Polish Refract portfolio evidence and claim consistency"
          git push origin HEAD:refract-desktop-proof
